<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakup Yesil - Die Stier Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive;
        }

        .scene {
            position: relative;
            width: 900px;
            height: 600px;
        }

        /* Der fette Stier */
        .bull {
            position: absolute;
            bottom: 120px;
            left: 150px;
            font-size: 120px;
            animation: bull-strain 0.5s ease-in-out infinite;
        }

        @keyframes bull-strain {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.95) scaleX(1.05); }
        }

        .bull-svg {
            width: 350px;
            height: 250px;
        }

        /* Schweiß-Tropfen */
        .sweat {
            position: absolute;
            top: -30px;
            left: 80px;
            font-size: 30px;
            animation: sweat-drop 1s ease-in-out infinite;
        }

        @keyframes sweat-drop {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.5; transform: translateY(10px); }
        }

        /* Der Name der hinten rauskommt und liegen bleibt */
        .name-container {
            position: absolute;
            bottom: 140px;
            right: 80px;
            transform-origin: left center;
        }

        .name {
            font-size: 42px;
            font-weight: bold;
            color: #8B4513;
            text-shadow:
                3px 3px 0 #5D3A1A,
                -1px -1px 0 #5D3A1A,
                1px -1px 0 #5D3A1A,
                -1px 1px 0 #5D3A1A,
                0 0 20px #DAA520,
                0 0 40px #FFD700;
            animation: poop-out 6s ease-out forwards;
            white-space: nowrap;
            display: inline-block;
        }

        @keyframes poop-out {
            0% {
                transform: translateX(-200px) scaleX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                transform: translateX(-180px) scaleX(0.3) rotate(-5deg);
                opacity: 1;
            }
            25% {
                transform: translateX(-100px) scaleX(0.6) rotate(5deg);
            }
            40% {
                transform: translateX(-20px) scaleX(0.9) rotate(-3deg);
            }
            50% {
                transform: translateX(0px) scaleX(1) rotate(2deg);
            }
            60% {
                transform: translateX(10px) translateY(20px) scaleX(1) rotate(5deg);
            }
            70% {
                transform: translateX(15px) translateY(60px) scaleX(1) rotate(8deg);
            }
            80% {
                transform: translateX(20px) translateY(100px) scaleX(1) rotate(10deg);
            }
            90% {
                transform: translateX(25px) translateY(130px) scaleX(1) rotate(12deg);
            }
            100% {
                transform: translateX(30px) translateY(145px) scaleX(1) rotate(15deg);
                opacity: 1;
            }
        }

        /* Liegender Name Effekt */
        .name.landed {
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(30px) translateY(145px) rotate(15deg); }
            50% { transform: translateX(30px) translateY(145px) rotate(13deg); }
        }

        /* Stink-Wolken beim Hintern */
        .stink {
            position: absolute;
            font-size: 40px;
            animation: stink-float 2s ease-out infinite;
            opacity: 0.7;
        }

        .stink:nth-child(1) { right: 280px; bottom: 180px; animation-delay: 0s; }
        .stink:nth-child(2) { right: 250px; bottom: 160px; animation-delay: 0.5s; }
        .stink:nth-child(3) { right: 310px; bottom: 150px; animation-delay: 1s; }

        @keyframes stink-float {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-80px) translateX(30px) scale(1.5); opacity: 0; }
        }

        /* Splatter Effekt beim landen */
        .splatter {
            position: absolute;
            bottom: 20px;
            right: 50px;
            font-size: 50px;
            opacity: 0;
            animation: splat-appear 6s ease-out forwards;
        }

        @keyframes splat-appear {
            0%, 70% { opacity: 0; transform: scale(0); }
            85% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Titel */
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: 24px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Sound Effekt Text */
        .sound-effect {
            position: absolute;
            font-size: 36px;
            font-weight: bold;
            color: #FF6B6B;
            opacity: 0;
            animation: sound-pop 6s ease-out forwards;
        }

        .sound-effect.prrrt {
            top: 180px;
            right: 200px;
        }

        .sound-effect.platsch {
            bottom: 80px;
            right: 180px;
            animation-delay: 0s;
        }

        @keyframes sound-pop {
            0%, 10% { transform: scale(0); opacity: 0; }
            20%, 40% { transform: scale(1.2); opacity: 1; }
            50% { transform: scale(1); opacity: 0.8; }
            60% { opacity: 0; }
            75%, 85% { transform: scale(0); opacity: 0; }
            90% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Boden */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, #2d5016 0%, #1a3009 100%);
            border-top: 4px solid #3d6b1e;
        }

        /* Goldene Buchstaben Animation wenn gelandet */
        .letter {
            display: inline-block;
        }

        .name.landed .letter {
            animation: letter-pulse 0.5s ease infinite;
        }

        .name.landed .letter:nth-child(1) { animation-delay: 0.05s; }
        .name.landed .letter:nth-child(2) { animation-delay: 0.1s; }
        .name.landed .letter:nth-child(3) { animation-delay: 0.15s; }
        .name.landed .letter:nth-child(4) { animation-delay: 0.2s; }
        .name.landed .letter:nth-child(5) { animation-delay: 0.25s; }
        .name.landed .letter:nth-child(6) { animation-delay: 0.3s; }
        .name.landed .letter:nth-child(7) { animation-delay: 0.35s; }
        .name.landed .letter:nth-child(8) { animation-delay: 0.4s; }
        .name.landed .letter:nth-child(9) { animation-delay: 0.45s; }
        .name.landed .letter:nth-child(10) { animation-delay: 0.5s; }
        .name.landed .letter:nth-child(11) { animation-delay: 0.55s; }

        @keyframes letter-pulse {
            0%, 100% { color: #8B4513; }
            50% { color: #DAA520; text-shadow: 0 0 20px #FFD700; }
        }

        /* Fliegen die um den Haufen kreisen */
        .fly {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: fly-appear 6s ease-out forwards, fly-circle 2s linear infinite;
        }

        .fly:nth-child(1) { animation-delay: 5s, 5s; }
        .fly:nth-child(2) { animation-delay: 5.3s, 5.3s; }
        .fly:nth-child(3) { animation-delay: 5.6s, 5.6s; }

        @keyframes fly-appear {
            0%, 80% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fly-circle {
            0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
        }

        .flies-container {
            position: absolute;
            bottom: 100px;
            right: 120px;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="title">🎬 Die legendäre Stier-Animation 🎬</div>

        <!-- Boden -->
        <div class="ground"></div>

        <!-- Sound Effekte -->
        <div class="sound-effect prrrt">PRRRT!</div>
        <div class="sound-effect platsch">PLATSCH!</div>

        <!-- Der Stier -->
        <div class="bull">
            <div class="sweat">💦</div>
            <svg class="bull-svg" viewBox="0 0 200 150">
                <!-- Körper -->
                <ellipse cx="100" cy="90" rx="70" ry="50" fill="#8B4513"/>
                <!-- Bauch (extra fett) -->
                <ellipse cx="100" cy="100" rx="75" ry="45" fill="#A0522D"/>
                <!-- Kopf -->
                <circle cx="40" cy="70" r="30" fill="#8B4513"/>
                <!-- Schnauze -->
                <ellipse cx="20" cy="80" rx="15" ry="12" fill="#DEB887"/>
                <!-- Nasenlöcher -->
                <circle cx="15" cy="78" r="3" fill="#333"/>
                <circle cx="25" cy="78" r="3" fill="#333"/>
                <!-- Augen (angestrengt) -->
                <line x1="30" y1="60" x2="40" y2="65" stroke="#333" stroke-width="3"/>
                <line x1="45" y1="60" x2="55" y2="65" stroke="#333" stroke-width="3"/>
                <!-- Hörner -->
                <path d="M 35 45 Q 20 20 35 25" stroke="#F5DEB3" stroke-width="8" fill="none"/>
                <path d="M 55 45 Q 70 20 55 25" stroke="#F5DEB3" stroke-width="8" fill="none"/>
                <!-- Beine -->
                <rect x="50" y="130" width="15" height="30" fill="#5D3A1A"/>
                <rect x="75" y="130" width="15" height="30" fill="#5D3A1A"/>
                <rect x="110" y="130" width="15" height="30" fill="#5D3A1A"/>
                <rect x="135" y="130" width="15" height="30" fill="#5D3A1A"/>
                <!-- Schwanz (hochgehoben) -->
                <path d="M 170 80 Q 190 60 185 40" stroke="#5D3A1A" stroke-width="6" fill="none"/>
                <circle cx="185" cy="38" r="8" fill="#5D3A1A"/>
                <!-- Hinterteil Öffnung -->
                <ellipse cx="170" cy="95" rx="8" ry="6" fill="#5D3A1A"/>
                <!-- Roter angestrengter Kopf -->
                <circle cx="40" cy="70" r="25" fill="rgba(255,0,0,0.2)"/>
            </svg>
        </div>

        <!-- Stink Wolken beim Hintern -->
        <div class="stink">💨</div>
        <div class="stink">💨</div>
        <div class="stink">💨</div>

        <!-- Der Name der hinten rauskommt -->
        <div class="name-container">
            <div class="name" id="yakup-name">
                <span class="letter">Y</span><span class="letter">A</span><span class="letter">K</span><span class="letter">U</span><span class="letter">P</span><span class="letter">&nbsp;</span><span class="letter">Y</span><span class="letter">E</span><span class="letter">S</span><span class="letter">I</span><span class="letter">L</span>
            </div>
        </div>

        <!-- Splatter wenn gelandet -->
        <div class="splatter">💩💩💩</div>

        <!-- Fliegen -->
        <div class="flies-container">
            <span class="fly">🪰</span>
            <span class="fly">🪰</span>
            <span class="fly">🪰</span>
        </div>
    </div>

    <script>
        // Nach 6 Sekunden (wenn Animation fertig) die "landed" Klasse hinzufügen
        setTimeout(() => {
            const name = document.getElementById('yakup-name');
            name.classList.add('landed');
        }, 6000);

        // Gelegentlich Stink-Partikel vom Haufen
        function createStinkParticle() {
            const scene = document.querySelector('.scene');
            const particle = document.createElement('div');
            particle.textContent = '💨';
            particle.style.cssText = `
                position: absolute;
                bottom: 80px;
                right: ${100 + Math.random() * 80}px;
                font-size: ${20 + Math.random() * 15}px;
                opacity: 0.6;
                pointer-events: none;
                z-index: 10;
            `;
            scene.appendChild(particle);

            let y = 0;
            let opacity = 0.6;

            function animate() {
                y += 2;
                opacity -= 0.01;
                particle.style.transform = `translateY(-${y}px)`;
                particle.style.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    particle.remove();
                }
            }

            // Erst nach 6 Sekunden starten (wenn Name gelandet ist)
            animate();
        }

        // Nach 6 Sekunden Stink-Partikel starten
        setTimeout(() => {
            setInterval(createStinkParticle, 800);
        }, 6000);
    </script>
</body>
</html>
